<!doctype html>
<!-- Google Play feature graphic (1024x500). Render: see store/README.md. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: radial-gradient(120% 140% at 85% 20%, #173a37 0%, #12151a 55%);
    color: #f5f7fa; font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 72px; box-sizing: border-box;
  }
  .mark { display: flex; align-items: center; gap: 18px; font: 700 54px 'Space Grotesk'; letter-spacing: -1.5px; }
  .tile { width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center;
    background: linear-gradient(145deg, #2ee3c2, #14c9b6); color: #0b2e2a; font: 700 52px 'Space Grotesk';
    box-shadow: 0 8px 28px rgba(46,227,194,.45); }
  .sg { color: #8a97aa; font-weight: 500; }
  h1 { margin: 34px 0 0; font-weight: 600; font-size: 40px; letter-spacing: -1px; line-height: 1.15; }
  p { margin: 14px 0 0; font-size: 21px; color: #aab5c5; font-weight: 500; }
  .pins { position: relative; width: 300px; height: 330px; }
  .pin { position: absolute; padding: 12px 20px 12px 16px; border-radius: 999px; background: #232a33;
    font: 600 28px 'Plus Jakarta Sans'; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 10px 24px rgba(0,0,0,.35); }
  .pin i { width: 12px; height: 12px; border-radius: 50%; background: #2ee3c2; display: block; }
  .pin.best { background: #2ee3c2; color: #0b2e2a; }
  .pin.best i { background: #0b2e2a; }
  .pin.full i { background: #ff5a5f; }
</style></head>
<body>
  <div>
    <div class="mark"><span class="tile">P</span><span>wheretopark<span class="sg">.sg</span></span></div>
    <h1>Know the price<br>before the ramp.</h1>
    <p>Live lots and real rates for carparks across Singapore.</p>
  </div>
  <div class="pins">
    <div class="pin" style="left:40px;top:10px"><i></i>$2.40</div>
    <div class="pin full" style="left:170px;top:80px"><i></i>$3.20</div>
    <div class="pin best" style="left:10px;top:140px"><i></i>$1.20</div>
    <div class="pin" style="left:150px;top:220px"><i></i>$2.00</div>
  </div>
</body></html>
