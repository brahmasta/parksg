<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f5" />

    <!-- Theme, applied before first paint so no one sees the wrong palette
         flash. Mirrors src/lib/theme.ts: the visitor's stored pick wins, else
         the deploy default from VITE_DEFAULT_THEME (Vite substitutes the
         %…% placeholder at build time), else 'auto'. 'auto' follows the
         device. Kept inline and dependency-free — it runs before the bundle. -->
    <script>
      (function () {
        var PREFS = { auto: 1, sunlight: 1, light: 1, dark: 1 };
        var COLORS = { sunlight: '#eef1f5', light: '#fafafa', dark: '#12151a' };
        // Unset at build time? Vite leaves the placeholder, which fails the
        // lookup below and falls through to 'auto'.
        var fallback = '%VITE_DEFAULT_THEME%';
        if (!PREFS[fallback]) fallback = 'auto';
        var pref;
        try {
          pref = localStorage.getItem('psg:theme');
        } catch (e) {
          /* private mode / storage blocked */
        }
        if (!PREFS[pref]) pref = fallback;
        var theme = pref;
        if (pref === 'auto') {
          var dark = false;
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e) {
            /* no matchMedia */
          }
          theme = dark ? 'dark' : 'sunlight';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', COLORS[theme]);
      })();
    </script>

    <!-- PWA: installable as a home-screen app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="wheretopark" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- SEO_HEAD_START — the SSR routes (api/home, api/carpark, api/parking-near)
         replace everything up to SEO_HEAD_END with per-page title/description/
         canonical/OG + JSON-LD. Served verbatim (home defaults) when un-injected. -->
    <!--SEO_HEAD_START-->
    <title>wheretopark.sg — Find parking before you leave</title>
    <meta
      name="description"
      content="Compare Singapore carpark rates and availability before you drive. Live HDB, URA and LTA prices, cheapest options near you, and which carparks have lots."
    />
    <link rel="canonical" href="https://wheretopark.sg/" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="wheretopark.sg" />
    <meta property="og:title" content="wheretopark.sg — Find parking before you leave" />
    <meta
      property="og:description"
      content="Compare Singapore carpark rates and availability before you drive. Live HDB, URA and LTA prices and the cheapest options near you."
    />
    <meta property="og:url" content="https://wheretopark.sg/" />
    <meta property="og:image" content="https://wheretopark.sg/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="wheretopark.sg — Find parking before you leave" />
    <meta
      name="twitter:description"
      content="Compare Singapore carpark rates and availability before you drive."
    />
    <meta name="twitter:image" content="https://wheretopark.sg/og.png" />
    <!--SEO_HEAD_END-->
  </head>
  <body>
    <div id="root"><!--SEO_BODY--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
