<!doctype html>
<!-- Showcase card (1600x1000) for the Manfaat Labs project grid. Render: see showcase/README.md. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; }
  body { background: radial-gradient(90% 120% at 82% 18%, #183c39 0%, #12151a 58%); color: #f5f7fa;
         font-family: 'Plus Jakarta Sans', sans-serif; position: relative; }
  .copy { position: absolute; left: 96px; top: 120px; width: 640px; }
  .wm { height: 64px; display: block; }
  h1 { margin: 64px 0 0; font: 600 76px/1.04 'Plus Jakarta Sans'; letter-spacing: -2.4px; }
  p { margin: 28px 0 0; font-size: 27px; line-height: 1.45; color: #aab5c5; font-weight: 500; }
  .facts { margin-top: 56px; display: flex; gap: 44px; }
  .facts b { display: block; font: 700 46px/1 'Space Grotesk'; color: #2ee3c2; letter-spacing: -1px; }
  .facts span { display: block; margin-top: 10px; font-size: 19px; color: #aab5c5; }
  .phone { position: absolute; right: 360px; top: 112px; width: 390px; height: 752px; border-radius: 56px;
           background: #0b0d10; padding: 14px; box-sizing: border-box; box-shadow: 0 40px 90px rgba(0,0,0,.55), inset 0 0 0 2px #2a313b; }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 44px; display: block; }
  .car { position: absolute; right: 64px; bottom: 96px; width: 470px; border-radius: 22px; overflow: hidden;
         box-shadow: 0 30px 70px rgba(0,0,0,.55), 0 0 0 2px #2a313b; }
  .car img { display: block; width: 100%; }
  .tag { position: absolute; right: 64px; bottom: 50px; font-size: 18px; color: #8a97aa; letter-spacing: .4px; }
</style></head>
<body>
  <div class="copy">
    <img class="wm" src="assets/wordmark-on-dark.svg" alt="wheretopark.sg">
    <h1>Know the price before the ramp.</h1>
    <p>Real rates and live free lots for carparks across Singapore, cheapest first. On the web, Android and Android Auto.</p>
    <div class="facts">
      <div><b>3,800+</b><span>carparks mapped</span></div>
      <div><b>22k</b><span>rate rows</span></div>
      <div><b>10</b><span>live data sources</span></div>
    </div>
  </div>
  <div class="phone"><img src="assets/phone-3-detail.png" alt=""></div>
  <div class="car"><img src="assets/android-auto-results.png" alt=""></div>
  <div class="tag">Android Auto</div>
</body></html>
